spring.application.name=cursos
# ===== Base de datos =====

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cursos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Ederjesus_0805}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Clave para firmar los tokens. Mínimo 32 caracteres.
# En un trabajo real va en una variable de entorno, nunca en GitHub.
app.jwt.secret=${JWT_SECRET:mi-clave-secreta-para-jwt-de-prueba-cambiala-en-produccion}
# Cuánto dura un token: 3600000 ms = 1 hora
app.jwt.expiracion-ms=3600000

# ===== Usuario ADMIN que se crea al arrancar =====
app.admin.email=${ADMIN_EMAIL:admin@cursos.com}
app.admin.password=${ADMIN_PASSWORD:Admin123}
